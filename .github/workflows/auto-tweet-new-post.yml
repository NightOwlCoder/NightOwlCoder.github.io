name: Auto-Tweet New Blog Post

on:
  push:
    branches:
      - master
    paths:
      - '_posts/**'

jobs:
  tweet:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 2  # Fetch last 2 commits to detect new files
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        pip install tweepy pyyaml
    
    - name: Wait for GitHub Pages to deploy
      run: |
        echo "Waiting 180 seconds for GitHub Pages to deploy..."
        sleep 180
    
    - name: Detect new blog post and tweet
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      run: |
        python .github/scripts/tweet-new-post.py || {
          echo ""
          echo "Tweet failed. This is NOT a Cloudflare/IP issue — it reproduces locally."
          echo "Check, in order:"
          echo "  1. 403 with reason=client-not-enrolled -> the app is in an unfunded project."
          echo "     Move it to the funded project in the X developer portal. Keys stay the same."
          echo "  2. 401 on write while reads work -> tweepy is broken against this app."
          echo "     Post with: .venv-tweet/bin/python scripts/tweet-thread-v2.py --thread <file>"
          echo "  3. See AGENTS.md 'X API Auth' for the full triage."
          echo ""
          echo "The blog post itself published fine — Pages deploys in a separate job."
          exit 1
        }
